AutoName: iOS Icon Pack

Summary: Six eras of iOS-inspired icons and original wallpapers for Android

Description: |-
  iOS Icon Pack gives supported Android launchers an iOS-inspired look across
  six visual eras: iOS 14 through iOS 18, plus iOS 26 Liquid Glass. Browse every
  style in the app, use the iOS 18 mapping by default, or choose individual
  alternatives through a launcher's icon picker.

  Features:
  * 342 era variants and 25 exact icons for popular third-party apps
  * 671 app component mappings for common apps and Android system tools
  * 367 monochrome vectors for Material You themed icons
  * Six original offline wallpapers with preview, save, and apply controls
  * AMOLED dark dashboard with search, launcher shortcuts, and icon requests

  The app has no ads, analytics, in-app purchases, or license checks. It is open
  source under the MIT License.


AutoName: iOS Icon Pack

Summary: iOS-style icon pack covering six Apple design eras (iOS 14–18 + iOS 26 Liquid Glass)

Description: |-
  iOS Icon Pack replaces your Android app icons with faithful iOS-style artwork
  spanning six design eras — iOS 14 through iOS 18 and the iOS 26 Liquid Glass
  aesthetic. It works with any launcher that supports icon packs (Nova, Lawnchair,
  Niagara, Action, Smart Launcher, and more) via the standard Blueprint dashboard.

  Features:
  * Six distinct iOS design eras: iOS 14, 15, 16, 17, 18, and iOS 26 Liquid Glass
  * 135+ icons covering the most common apps; 247+ appfilter component entries
  * Blueprint dashboard with per-era browsing, icon search, and apply-to-launcher
  * Third-party icon set (tp_*) for popular apps that don't have a direct iOS analogue
  * AMOLED dark theme throughout

  This is an open-source project. Contributions welcome — see CONTRIBUTING.md for
  how to add icons using the icontool CLI.


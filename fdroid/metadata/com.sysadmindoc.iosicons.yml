AutoName: iOS Icon Pack

Summary: iOS-style Android icon pack across iOS 14-18 and iOS 26 Liquid Glass

Description: |-
  iOS Icon Pack replaces your Android launcher icons with iOS-style artwork
  spanning six design eras: iOS 14 through iOS 18 and the iOS 26 Liquid Glass
  aesthetic. It works with any launcher that supports icon packs (Nova, Lawnchair,
  Niagara, Action, Smart Launcher, and more) via the standard Blueprint dashboard.

  Features:
  * Six distinct iOS design eras: iOS 14, 15, 16, 17, 18, and iOS 26 Liquid Glass
  * 367 icons covering the most common apps; 671 appfilter component entries
  * Blueprint dashboard with per-era browsing, icon search, launcher apply shortcuts,
    and structured icon requests
  * Third-party icon set (tp_*) for popular apps that don't have a direct iOS analogue
  * AMOLED dark theme throughout

  This is an open-source project under MIT. No ads, tracking, or in-app purchases.
  See CONTRIBUTING.md for how to add icons using the icontool CLI.


name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  validate:
    name: Validate XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate appfilter / drawable consistency
        run: python3 scripts/validate_appfilter.py

      - name: Validate PNG dimensions and vector drawables
        run: python3 scripts/validate_drawables.py

      - name: Check gallery is up-to-date
        run: python3 scripts/gen_gallery.py --check

  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

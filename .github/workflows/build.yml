name: Build APK + AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.1.2). Leave blank for a dry-run build.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate appfilter consistency
        run: python3 scripts/validate_appfilter.py

      - name: Materialise release keystore (if base64 secret is provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IOSICONS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iosicons.jks"
            echo "path=$RUNNER_TEMP/iosicons.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::IOSICONS_KEYSTORE_BASE64 not set — release builds will be unsigned."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build per-era release APKs
        env:
          IOSICONS_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          IOSICONS_STORE_PASSWORD: ${{ secrets.IOSICONS_STORE_PASSWORD }}
          IOSICONS_KEY_ALIAS: ${{ secrets.IOSICONS_KEY_ALIAS }}
          IOSICONS_KEY_PASSWORD: ${{ secrets.IOSICONS_KEY_PASSWORD }}
        run: |
          VERSION=$(grep versionName buildSrc/src/main/java/MyApp.kt | grep -oP '"\K[^"]+')
          mkdir -p era-apks

          for ERA in ios14 ios15 ios16 ios17 ios18 ios26; do
            echo "::group::Building $ERA era"
            python3 scripts/set_era.py "$ERA"
            ./gradlew assembleRelease
            SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
            cp "$SRC" "era-apks/iOSIconPack-v${VERSION}-${ERA}.apk"
            echo "  → era-apks/iOSIconPack-v${VERSION}-${ERA}.apk"
            echo "::endgroup::"
          done

          # Restore default era for AAB
          python3 scripts/set_era.py ios18

      - name: Build Release AAB (ios18 default)
        env:
          IOSICONS_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          IOSICONS_STORE_PASSWORD: ${{ secrets.IOSICONS_STORE_PASSWORD }}
          IOSICONS_KEY_ALIAS: ${{ secrets.IOSICONS_KEY_ALIAS }}
          IOSICONS_KEY_PASSWORD: ${{ secrets.IOSICONS_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-icon-pack-apks
          path: era-apks/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-icon-pack-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${{ github.ref_name }}" \
            era-apks/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --title "iOS Icon Pack ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          TAG="${{ inputs.version }}"
          git tag -f "$TAG"
          git push -f origin "$TAG"
          gh release create "$TAG" \
            era-apks/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --title "iOS Icon Pack $TAG" \
            --generate-notes \
            || gh release upload "$TAG" \
              era-apks/*.apk \
              app/build/outputs/bundle/release/*.aab \
              --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
